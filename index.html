<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeD_u1ya | Технические работы</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0e0e10;
            --twitch-purple: #9146ff;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }
        
        * { 
            cursor: none !important; 
            -webkit-tap-highlight-color: transparent; 
            outline: none; 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--white);
            min-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, #1f1635 0%, var(--bg-dark) 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-orbs {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            background: var(--twitch-purple);
            animation: float 20s infinite ease-in-out;
        }
        
        .orb-1 {
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
            animation-duration: 25s;
        }
        
        .orb-2 {
            width: 300px;
            height: 300px;
            bottom: -50px;
            right: -50px;
            background: #6441a5;
            animation-duration: 18s;
            animation-delay: -5s;
        }
        
        .orb-3 {
            width: 250px;
            height: 250px;
            top: 40%;
            left: 60%;
            background: #9146ff;
            animation-duration: 30s;
            animation-delay: -10s;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, 50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .maintenance-container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
            width: 90%;
        }

        .maintenance-box {
            background: var(--glass);
            border: 2px solid var(--glass-border);
            border-radius: 30px;
            padding: 60px 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tools-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            animation: rotate 3s ease-in-out infinite;
        }

        .tools-icon svg {
            width: 100%;
            height: 100%;
            fill: var(--twitch-purple);
            filter: drop-shadow(0 0 20px var(--twitch-purple));
        }

        @keyframes rotate {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
        }

        .maintenance-title {
            font-size: clamp(28px, 6vw, 42px);
            font-weight: 900;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff, var(--twitch-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .maintenance-text {
            font-size: 16px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 30px;
            font-weight: 400;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #6441a5, var(--twitch-purple), #d9b3ff);
            border-radius: 10px;
            width: 0%;
            animation: loading 3s ease-in-out infinite;
            box-shadow: 0 0 15px var(--twitch-purple);
        }

        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        .dots {
            display: inline-block;
        }

        .dots::after {
            content: '...';
            animation: dots 1.5s steps(3, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        #cursor-glow, #cursor-dot {
            position: fixed;
            pointer-events: none;
            z-index: 999999;
        }

        #cursor-glow {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(145, 70, 255, 0.15) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            transition: left 0.1s, top 0.1s;
        }

        #cursor-dot {
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 15px var(--twitch-purple);
            transform: translate(-50%, -50%);
            transition: left 0.05s, top 0.05s;
        }

        #snow-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        @media (hover: none) and (pointer: coarse) {
            #cursor-glow, #cursor-dot, .trail-dot {
                display: none !important;
            }
            * {
                cursor: auto !important;
            }
        }

        .trail-dot {
            position: fixed;
            width: 8px;
            height: 8px;
            background: var(--twitch-purple);
            border-radius: 50%;
            pointer-events: none;
            z-index: 999998;
            opacity: 0.8;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 5px var(--twitch-purple);
        }

        @media (max-width: 768px) {
            .maintenance-box {
                padding: 40px 25px;
            }
            
            .maintenance-text {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <canvas id="snow-canvas"></canvas>

    <div id="cursor-glow"></div>
    <div id="cursor-dot"></div>

    <div class="maintenance-container">
        <div class="maintenance-box">
            <div class="tools-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/>
                </svg>
            </div>
            
            <h1 class="maintenance-title">Технические работы</h1>
            
            <p class="maintenance-text">
                Сайт временно недоступен<span class="dots"></span><br>
                Идут технические работы, просьба подождать
            </p>
            
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
        </div>
    </div>

    <script>
        const cGlow = document.getElementById('cursor-glow');
        const cDot = document.getElementById('cursor-dot');
        const trailDots = [];
        const trailCount = 15;

        for(let i = 0; i < trailCount; i++) {
            const d = document.createElement('div');
            d.className = 'trail-dot';
            document.body.appendChild(d);
            trailDots.push({el: d, x: 0, y: 0});
        }

        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            
            cGlow.style.left = x + 'px';
            cGlow.style.top = y + 'px';
            cDot.style.left = x + 'px';
            cDot.style.top = y + 'px';

            trailDots.forEach((dot, index) => {
                setTimeout(() => {
                    dot.el.style.left = x + 'px';
                    dot.el.style.top = y + 'px';
                    dot.el.style.opacity = (1 - index / trailCount) * 0.7;
                    dot.el.style.transform = `translate(-50%, -50%) scale(${1 - index / trailCount})`;
                }, index * 30);
            });
        });

        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let flakes = [];

        function initSnow() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            for(let i = 0; i < 80; i++) {
                flakes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 2 + 0.5,
                    d: Math.random() * 1 + 0.5,
                    a: Math.random() * Math.PI * 2,
                    o: Math.random() * 0.5 + 0.3
                });
            }
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        initSnow();

        function drawSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            flakes.forEach(p => {
                ctx.fillStyle = `rgba(255, 255, 255, ${p.o})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
                
                p.y += p.d;
                p.x += Math.sin(p.a) * 0.5;
                p.a += 0.02;
                
                if(p.y > canvas.height) {
                    p.y = -5;
                    p.x = Math.random() * canvas.width;
                }
                
                if(p.x > canvas.width) p.x = 0;
                if(p.x < 0) p.x = canvas.width;
            });
            
            requestAnimationFrame(drawSnow);
        }

        drawSnow();
    </script>
</body>
</html>
